# Prometheus config for the Docker Compose stack. Kubernetes scrapes through pod annotations or a
# ServiceMonitor instead (see the Helm chart).
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: infermesh-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: infermesh-telemetry-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["telemetry-consumer:9100"]
