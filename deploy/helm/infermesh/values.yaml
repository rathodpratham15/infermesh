# InferMesh chart defaults. These run on any cluster, with no GPU: the gateway uses the mock
# backend unless vllm.enabled or gateway.backends says otherwise. See values-local.yaml and
# values-gpu.yaml, and docs/kubernetes.md.

nameOverride: ""

serviceAccount:
  create: true
  name: ""

# Applied to every pod. Cluster- and cloud-specific scheduling belongs in your own values file.
imagePullSecrets: []

gateway:
  replicaCount: 2
  image:
    repository: infermesh-gateway
    tag: ""                     # defaults to the chart appVersion
    pullPolicy: IfNotPresent
  # Backends the gateway routes to. If empty, one is derived: "vllm" when vllm.enabled, else "mock".
  # Each entry: {name, kind (mock|vllm|triton), url, model, timeout, weight, maxConcurrent}
  backends: []
  routingPolicy: least_outstanding   # round_robin | least_outstanding | weighted
  maxRetries: 1
  maxQueue: 128
  requestTimeout: 2m
  healthInterval: 5s
  logLevel: info
  wsAllowedOrigins: ""               # comma-separated browser origins for the WebSocket
  otlpEndpoint: ""                   # e.g. http://otel-collector:4318 to export traces
  extraEnv: []
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {memory: 256Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    # Scale on in-flight requests per pod (the infermesh_requests_active gauge). This needs a custom
    # metrics pipeline (for example Prometheus + prometheus-adapter) that exposes it as a Pods metric.
    # It is NOT available on a bare cluster and has not been tested.
    activeRequests:
      enabled: false
      averageValue: "20"

# An OpenAI-compatible vLLM server. Disabled by default. GPU nodes are requested through
# resources.limits."nvidia.com/gpu" (see values-gpu.yaml); nothing here is cloud-provider specific.
vllm:
  enabled: false
  replicaCount: 1
  image:
    repository: vllm/vllm-openai
    tag: v0.31.0
    pullPolicy: IfNotPresent
  model: Qwen/Qwen2.5-0.5B-Instruct   # a small default; set a larger model on real GPUs
  port: 8000
  args: []                            # if empty: --model <model> --host 0.0.0.0 --port <port>
  extraArgs: []
  env: []
  # Hugging Face token for gated models: set one, or point at an existing Secret with key HF_TOKEN.
  hfToken: ""
  existingSecret: ""
  runtimeClassName: ""                # e.g. "nvidia" where the NVIDIA runtime is a RuntimeClass
  maxConcurrent: 16                   # gateway-side in-flight limit for this backend
  weight: 1
  timeout: 2m
  modelCache:
    persistence: {enabled: false, size: 50Gi, storageClass: "", accessMode: ReadWriteOnce}
  shmSize: 1Gi
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  startupProbe: {failureThreshold: 120, periodSeconds: 10}   # model loading can take minutes

# NVIDIA Triton Inference Server + TensorRT-LLM, served through Triton's OpenAI-compatible frontend
# (NVIDIA GPU only; disabled by default). Build the image from deploy/triton/Dockerfile (see
# docs/gpu-deployment.md). The gateway reaches it as an OpenAI-compatible backend of kind "triton",
# which is registered automatically when triton.enabled=true.
#
# NOT TESTED on a GPU: this component has only been rendered and schema-validated.
triton:
  enabled: false
  replicaCount: 1
  image:
    repository: infermesh-triton      # your build of deploy/triton/Dockerfile, pushed where the cluster can pull it
    tag: ""                           # required when enabled
    pullPolicy: IfNotPresent
  # Model served. If /models is empty on first start, the entrypoint builds a TensorRT-LLM engine with
  # `triton import -m <importModel>` (slow, memory hungry). Or mount a prepared repository.
  importModel: ""                     # e.g. llama-3.1-8b-instruct
  model: ""                           # client-facing model name the gateway sends (the model name in the repository)
  tokenizer: ""                       # HF id or path for chat templates (recommended)
  extraArgs: ""                       # appended to `triton start`
  env: []
  hfToken: ""
  existingSecret: ""                  # Secret with key HF_TOKEN
  runtimeClassName: ""
  port: 9000                          # the OpenAI frontend
  maxConcurrent: 16
  weight: 1
  timeout: 2m
  streamUsage: false                  # request token usage in streams; NVIDIA does not document it for TRT-LLM, enable only after verifying
  modelRepository:
    persistence: {enabled: false, size: 100Gi, storageClass: "", accessMode: ReadWriteOnce, existingClaim: ""}
  engineCache:
    persistence: {enabled: false, size: 100Gi, storageClass: "", accessMode: ReadWriteOnce}
  shmSize: 1Gi
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  startupProbe: {failureThreshold: 360, periodSeconds: 10}   # engine builds can take a long time

# Single-node KRaft Kafka for telemetry events only (never in the request path). For anything beyond
# a demo use a managed or operator-run cluster: set enabled=false and externalBrokers.
kafka:
  enabled: true
  externalBrokers: ""                 # e.g. "kafka-0.kafka:9092" when enabled=false
  topic: infermesh.inference.events
  image: {repository: apache/kafka, tag: "3.9.0", pullPolicy: IfNotPresent}
  persistence: {enabled: false, size: 5Gi, storageClass: ""}   # false = emptyDir (events are lost on restart)
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []

telemetryConsumer:
  enabled: true
  replicaCount: 1
  image:
    repository: infermesh-telemetry-consumer
    tag: ""
    pullPolicy: IfNotPresent
  group: infermesh-telemetry
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {memory: 128Mi}
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}

monitoring:
  # Pod annotations (prometheus.io/*) for annotation-based scrape configs.
  scrapeAnnotations: true
  # Needs the Prometheus Operator CRDs (kube-prometheus-stack).
  serviceMonitor:
    enabled: false
    interval: 15s
    labels: {}                        # e.g. {release: kube-prometheus-stack}
  # ConfigMap picked up by the Grafana dashboard sidecar (kube-prometheus-stack convention).
  dashboard:
    enabled: true
    labels: {grafana_dashboard: "1"}
