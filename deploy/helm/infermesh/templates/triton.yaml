{{- $t := .Values.triton }}
{{- if $t.enabled }}
{{- if not $t.image.tag }}{{ fail "triton.image.tag is required when triton.enabled=true (choose a TensorRT-LLM flavoured tritonserver tag)" }}{{ end }}
{{- $claim := ternary $t.modelRepository.persistence.existingClaim (printf "%s-triton-models" (include "infermesh.fullname" .)) (ne $t.modelRepository.persistence.existingClaim "") }}
{{- if and $t.modelRepository.persistence.enabled (eq $t.modelRepository.persistence.existingClaim "") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  labels: {{- include "infermesh.labels" . | nindent 4 }}
spec:
  accessModes: [{{ $t.modelRepository.persistence.accessMode }}]
  {{- with $t.modelRepository.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ $t.modelRepository.persistence.size }}}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infermesh.fullname" . }}-triton
  labels: {{- include "infermesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: triton
spec:
  replicas: {{ $t.replicaCount }}
  selector:
    matchLabels: {{- include "infermesh.selector" (dict "ctx" . "component" "triton") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels: {{- include "infermesh.selector" (dict "ctx" . "component" "triton") | nindent 8 }}
      annotations:
        {{- if $.Values.monitoring.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $t.metricsPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with $t.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "infermesh.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $t.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: triton
          image: {{ include "infermesh.image" (dict "image" $t.image "ctx" .) }}
          imagePullPolicy: {{ $t.image.pullPolicy }}
          command: ["tritonserver"]
          args:
            {{- if $t.args }}
            {{- toYaml $t.args | nindent 12 }}
            {{- else }}
            - --model-repository={{ $t.modelRepository.mountPath }}
            - --http-port={{ $t.httpPort }}
            - --grpc-port={{ $t.grpcPort }}
            - --metrics-port={{ $t.metricsPort }}
            {{- end }}
          {{- with $t.env }}
          env: {{ toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $t.httpPort }}}
            - {name: grpc, containerPort: {{ $t.grpcPort }}}
            - {name: metrics, containerPort: {{ $t.metricsPort }}}
          startupProbe:
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 20
          resources: {{ toYaml $t.resources | nindent 12 }}
          volumeMounts:
            - {name: shm, mountPath: /dev/shm}
            - {name: models, mountPath: {{ $t.modelRepository.mountPath }}}
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: {{ $t.shmSize }}}
        - name: models
          {{- if $t.modelRepository.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ $claim }}}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with $t.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $t.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $t.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infermesh.fullname" . }}-triton
  labels: {{- include "infermesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: triton
spec:
  selector: {{- include "infermesh.selector" (dict "ctx" . "component" "triton") | nindent 4 }}
  ports:
    - {name: http, port: {{ $t.httpPort }}, targetPort: http}
    - {name: grpc, port: {{ $t.grpcPort }}, targetPort: grpc}
    - {name: metrics, port: {{ $t.metricsPort }}, targetPort: metrics}
{{- end }}
